name: pytest

# Runs the skcomms pytest suite on GitHub-hosted runners.
#
# GREEN-by-construction: this mirrors the repo's own known-passing invocation
# (see qa.yml) — install the package with its `dev` extras, then run the WHOLE
# suite. The suite is CI-clean: it requires no live external services and no
# sibling sk* packages.
#
# Honest notes on scope (verified 2026-06-28):
#   * There are NO custom pytest markers in this repo (no `integration`,
#     `e2e_live`, `bunker`, etc. registered or applied). So there is nothing to
#     exclude with `-m "not ..."` — adding such a filter would be fabricated.
#   * Optional-transport tests (telegram/discord/webrtc/zeroconf/liboqs) and the
#     capauth/skcapstone-dependent paths self-skip via pytest.importorskip /
#     @pytest.mark.skipif when those packages are absent. The `dev` extras
#     (pytest, pytest-asyncio, fastapi, httpx, pgpy, websockets, cryptography)
#     are the deliberate known-green dependency set; sibling sk* packages
#     (capauth, skcapstone, sk-pqc) are NOT installed and the suite stays green
#     without them.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install skcomms + dev extras
        # -c constraints.txt pins the dev/runtime set to the versions this repo
        # validated, so a fresh runner installs exactly what CI last tested.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
      # skcomms does NOT depend on skcapstone (that would invert the direction),
      # but tests/test_integration.py exercises "integrated" mode and assumed a
      # dev venv where skcapstone happens to be installed. In CI it is not, so
      # those tests errored with ModuleNotFoundError instead of testing anything.
      # skcoord is named too: skcapstone.coordination is now a re-export shim
      # over it, and --no-deps means we resolve the graph by hand. --no-deps also
      # stops this dragging a published skcomms over the checkout under test.
      - name: Install skcapstone (optional integration backbone) from source
        run: |
          pip install --no-deps --no-cache-dir \
            "skcapstone @ git+https://github.com/smilinTux/skcapstone@main" \
            "skcoord @ git+https://github.com/smilinTux/skcoord@master"
      - name: Run pytest (full suite)
        run: python -m pytest tests/ -q

  # The pqdm/pqdm2 crypto gates are the ONE place a wire-format drift between
  # this repo and the Dart client (sk-pqc-dart / skworld-app) gets caught, and
  # they are exactly the tests the `dev`-extras job above cannot run: every
  # hybrid KEM op needs liboqs, and pqdm.open_multi() swallows a missing backend
  # into a plain `None` return, so without liboqs the gate cannot fail-loud — it
  # self-skips. This job installs the `pqc` extra so the gate genuinely runs.
  #
  # liboqs-python builds liboqs from source into ~/_oqs on first import when it
  # cannot find a system copy, so that directory is cached across runs.
  pqc-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the liboqs build
        uses: actions/cache@v4
        with:
          path: ~/_oqs
          key: liboqs-${{ runner.os }}-${{ hashFiles('constraints.txt') }}
      - name: Install skcomms + dev + pqc extras
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,pqc]"
      # skcomms does NOT depend on skcapstone (that would invert the direction),
      # but tests/test_integration.py exercises "integrated" mode and assumed a
      # dev venv where skcapstone happens to be installed. In CI it is not, so
      # those tests errored with ModuleNotFoundError instead of testing anything.
      # skcoord is named too: skcapstone.coordination is now a re-export shim
      # over it, and --no-deps means we resolve the graph by hand. --no-deps also
      # stops this dragging a published skcomms over the checkout under test.
      - name: Install skcapstone (optional integration backbone) from source
        run: |
          pip install --no-deps --no-cache-dir \
            "skcapstone @ git+https://github.com/smilinTux/skcapstone@main" \
            "skcoord @ git+https://github.com/smilinTux/skcoord@master"
      - name: Assert the PQ backend is really present
        # Without this the crypto gates would silently self-skip and the job
        # would report green while proving nothing.
        run: |
          python -c "from skcomms import pqkem; assert pqkem.is_available(), 'liboqs missing: the pqdm gates would self-skip'"
      - name: Run the pqdm / pqdm2 interop gates
        run: python -m pytest tests/test_pqdm.py tests/test_pqdm2.py tests/test_pqdm2_interop.py -q
