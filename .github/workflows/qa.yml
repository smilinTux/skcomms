name: QA

# Runs the full skcomms QA pytest suite on every push to main, every PR, and
# every version tag. The suite is CI-clean (no live external services required),
# so we run it whole.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        # -c constraints.txt pins to the versions this repo validated (inert on
        # the fallback branch, which installs a smaller set).
        run: |
          pip install -c constraints.txt -e ".[crypto,dev,pqc]" || { pip install -c constraints.txt -e . && pip install -c constraints.txt pytest pytest-asyncio; }
      # skcomms does NOT depend on skcapstone (that would invert the direction),
      # but tests/test_integration.py exercises "integrated" mode and assumed a
      # dev venv where skcapstone happens to be installed. In CI it is not, so
      # those tests errored with ModuleNotFoundError instead of testing anything.
      # skcoord is named too (skcapstone.coordination is a re-export shim over it),
      # and skcot, which backs geo_store.SkcotGeoStore and is git-only (not on PyPI,
      # not declared), so CI could never have exercised the skcot bridge. --no-deps
      # also stops this dragging a published skcomms over the checkout under test.
      - name: Install skcapstone (optional integration backbone) from source
        run: |
          pip install --no-deps --no-cache-dir \
            "skcapstone @ git+https://github.com/smilinTux/skcapstone@main" \
            "skcoord @ git+https://github.com/smilinTux/skcoord@master" \
            "skcot @ git+https://github.com/smilinTux/skcot@main" \
            "capauth @ git+https://github.com/smilinTux/capauth@main"
      - name: Run QA pytest suite
        run: python -m pytest tests/ -q
