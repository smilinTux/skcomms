name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # -c constraints.txt pins every dependency to the versions this repo
        # validated, so CI does not silently drift onto newer releases.
        run: pip install -c constraints.txt -e ".[crypto,dev,pqc]"
      # skcomms does NOT depend on skcapstone (that would invert the direction),
      # but tests/test_integration.py exercises "integrated" mode and assumed a
      # dev venv where skcapstone happens to be installed. In CI it is not, so
      # those tests errored with ModuleNotFoundError instead of testing anything.
      # skcoord is named too (skcapstone.coordination is a re-export shim over it),
      # and skcot, which backs geo_store.SkcotGeoStore and is git-only (not on PyPI,
      # not declared), so CI could never have exercised the skcot bridge. --no-deps
      # also stops this dragging a published skcomms over the checkout under test.
      - name: Install skcapstone (optional integration backbone) from source
        run: |
          pip install --no-deps --no-cache-dir \
            "skcapstone @ git+https://github.com/smilinTux/skcapstone" \
            "skcoord @ git+https://github.com/smilinTux/skcoord" \
            "skcot @ git+https://github.com/smilinTux/skcot" \
            "capauth @ git+https://github.com/smilinTux/capauth"
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=skcomms --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Versions come from constraints.txt (black==26.5.1, ruff==0.15.21),
      # which already does the pinning correctly. Do NOT re-pin them inline:
      # naming a different version here makes pip unsolvable against the
      # constraint file, which fails the job on install before it lints
      # anything at all.
      - name: Install lint tools
        run: pip install -c constraints.txt black ruff
      - name: Check formatting
        run: black --check src/ tests/
      - name: Lint
        run: ruff check src/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Check dist
        run: |
          pip install twine
          twine check dist/*
