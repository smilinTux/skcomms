name: secret-scan

# Secret-scan gate: keeps the repo's clean secrets hygiene true over time.
#
# Runs gitleaks (the fleet default, via its official GitHub Action) on every
# push and every pull request. The build FAILS if gitleaks finds anything not
# covered by the baseline allowlist in .gitleaks.toml at the repo root.
#
# The allowlist documents known non-secret placeholder tokens; see that file
# for how to add an entry when a real placeholder trips the scanner. If the
# scanner flags a REAL secret, rotate it and purge it from history, do NOT
# add it to the allowlist.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a push scans every new commit, not just the tip.
          fetch-depth: 0
      # Run the gitleaks BINARY, not gitleaks-action.
      #
      # The action requires a paid license for ORGANIZATION-owned repos, and
      # this repo is owned by the smilinTux org, so every run died with
      # "missing gitleaks license" BEFORE scanning anything. That is worse than
      # having no gate: the check sat red on main for months, so it read as
      # known-broken and got ignored, while the repo had no secret scanning at
      # all. It also hid a real (benign) finding, see .gitleaks.toml.
      #
      # gitleaks itself is MIT-licensed and free. Only the ACTION wrapper is
      # licensed, so invoking the binary directly restores real scanning at no
      # cost and with no org secret to provision. Pinned to an exact version so
      # a new upstream rule cannot turn CI red without a deliberate bump.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        # --redact so a genuine finding never echoes the secret into public CI
        # logs. --exit-code 1 makes a finding fail the build.
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1
