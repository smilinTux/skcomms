name: secret-scan

# Secret-scan gate: keeps the repo's clean secrets hygiene true over time.
#
# Runs gitleaks (the fleet default, via its official GitHub Action) on every
# push and every pull request. The build FAILS if gitleaks finds anything not
# covered by the baseline allowlist in .gitleaks.toml at the repo root.
#
# The allowlist documents known non-secret placeholder tokens; see that file
# for how to add an entry when a real placeholder trips the scanner. If the
# scanner flags a REAL secret, rotate it and purge it from history, do NOT
# add it to the allowlist.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a push scans every new commit, not just the tip.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Use the baseline/allowlist committed at the repo root.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action requires a license for ORGANIZATION-owned repos.
          # The note here used to say this repo ran on an individual account;
          # it does not, it is owned by the smilinTux org, which is why every
          # run fails with "missing gitleaks license" before scanning anything.
          # Licensing keys on org-vs-personal, not public-vs-private, so being
          # a public repo does not exempt it.
          #
          # Free key for open source at https://gitleaks.io; add it as an
          # organization secret named GITLEAKS_LICENSE so every smilinTux repo
          # can use the same one. Until it exists this reference is harmless:
          # an unset secret expands to empty, exactly as today.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
